<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="معلّم بلس — مساحة عمل عربية للمعلم لإعداد خطط الدروس والأنشطة والاختبارات وبطاقات التفكير في مكان واحد"
    />
    <meta name="theme-color" content="#0f766e" />
    <title>معلّم بلس | مساحة عمل المعلم</title>
    <script>
      // تطبيق الوضع الداكن قبل تحميل CSS لتجنّب الوميض
      ;(function () {
        try {
          var saved = localStorage.getItem('moallem-plus:theme')
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* تجاهل */
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
