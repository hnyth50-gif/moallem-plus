<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="معلّم بلس — مساحة عمل عربية للمعلم لإعداد خطط الدروس والأنشطة والاختبارات وبطاقات التفكير في مكان واحد"
    />
    <meta name="theme-color" content="#0f766e" />
    <title>معلّم بلس | مساحة عمل المعلم</title>
    <script>
      // تطبيق الوضع الداكن ولون الموقع المحفوظ قبل تحميل CSS لتجنّب الوميض
      ;(function () {
        try {
          var saved = localStorage.getItem('moallem-plus:theme')
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* تجاهل */
        }
        try {
          var accentVars = localStorage.getItem('moallem-plus:accent-vars')
          if (accentVars) {
            var vars = JSON.parse(accentVars)
            for (var k in vars) document.documentElement.style.setProperty(k, vars[k])
          }
        } catch (e) {
          /* تجاهل */
        }
        // تحميل الخلفية المحفوظة قبل أول رسم لتجنب الوميض.
        try {
          var rawBackground = localStorage.getItem('moallem-plus:background')
          var background = rawBackground ? JSON.parse(rawBackground) : null
          var patterns = ['education', 'concept', 'notebook', 'none']
          var pattern = background && patterns.indexOf(background.pattern) !== -1 ? background.pattern : 'education'
          var intensity = background && typeof background.intensity === 'number' && isFinite(background.intensity)
            ? Math.max(0, Math.min(35, Math.round(background.intensity / 5) * 5))
            : 15
          document.documentElement.dataset.background = pattern
          document.documentElement.style.setProperty('--background-opacity', String(intensity / 100))
          document.documentElement.style.setProperty('--background-opacity-dark', String(intensity / 100 * 0.75))
        } catch (e) {
          document.documentElement.dataset.background = 'education'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- مكتبة Supabase من CDN: سكربت كلاسيكي قبل حزمة التطبيق لضمان توفر window.supabase
         عند الإقلاع. عند الانقطاع يفشل التحميل بصمت ويعمل التطبيق محليًا كالمعتاد. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
